name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - funding-demo-final
      - v10-world-intelligence-engine

jobs:
  quality:
    name: Quality, security and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Static checks
        run: npm run check

      - name: Security scan
        run: npm run security:scan

      - name: Unit tests
        run: npm test
